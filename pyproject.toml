[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastvideo"
version = "1.2.0"
description = "FastVideo"
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.5.0",
    "torchvision==0.20.0",
    "torchaudio==2.5.0",
    "setuptools",
    "packaging",
    "ninja",
    "flash-attn==2.7.0.post2",
    "transformers==4.46.1",
    "accelerate==1.0.1",
    "tokenizers==0.20.1",
    "albumentations==1.4.20",
    "av==13.1.0",
    "decord==0.6.0",
    "einops==0.8.0",
    "fastapi==0.115.3",
    "gdown==5.2.0",
    "h5py==3.12.1",
    "idna==3.6",
    "imageio==2.36.0",
    "matplotlib==3.9.2",
    "numpy==1.26.3",
    "omegaconf==2.3.0",
    "opencv-python==4.10.0.84",
    "opencv-python-headless==4.10.0.84",
    "pandas==2.2.3",
    "pillow==10.2.0",
    "pydub==0.25.1",
    "pytorch-lightning==2.4.0",
    "pytorchvideo==0.1.5",
    "PyYAML==6.0.1",
    "regex==2024.9.11",
    "requests==2.31.0",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "six==1.16.0",
    "test-tube==0.7.5",
    "timm==1.0.11",
    "torchdiffeq==0.2.4",
    "torchmetrics==1.5.1",
    "tqdm==4.66.5",
    "urllib3==2.2.0",
    "uvicorn==0.32.0",
    "scikit-video==1.1.11",
    "imageio-ffmpeg==0.5.1",
    "sentencepiece==0.2.0",
    "beautifulsoup4==4.12.3",
    "ftfy==6.3.0",
    "moviepy==1.0.3",
    "wandb==0.18.5",
    "tensorboard==2.18.0",
    "pydantic==2.9.2",
    "gradio==5.3.0",
    "huggingface_hub==0.26.1",
    "protobuf==5.28.3",
    "watch",
    "gpustat",
    "peft==0.13.2",
    "liger_kernel==0.4.1",
    "wheel==0.44.0",
    "loguru",
    "diffusers==0.32.0",
    "bitsandbytes",
    "easydict>=1.13",
    "hpsv2>=1.2.0",
    # CUDA extensions from the flash-attention repo (csrc/fused_dense_lib and
    # csrc/layer_norm). The layer_norm extension provides `dropout_layer_norm`,
    # required by hpsv2 / open_clip code paths.
    "fused-dense-lib",
    "dropout-layer-norm",
    # xformers wheel matching torch==2.5.0 (post2 is the only 0.0.28.x build
    # that pins torch==2.5.0 exactly; post3 requires torch==2.5.1).
    "xformers==0.0.28.post2",
    "video2dataset>=1.1.0",
]

[project.optional-dependencies]
lint = [
    "yapf==0.32.0",
    "toml==0.10.2",
    "tomli==2.0.2",
    "ruff==0.6.5",
    "codespell==2.3.0",
    "isort==5.13.2",
    "sphinx-lint==1.0.0",
    "mypy==1.11.1",
    "types-PyYAML",
    "types-requests",
    "types-setuptools",
]

[tool.setuptools.packages.find]
exclude = ["assets*", "docker*", "docs", "scripts*"]

[tool.wheel]
exclude = ["assets*", "docker*", "docs", "scripts*"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true

# --- uv configuration -------------------------------------------------------
# Mirrors env_setup.sh: torch/torchvision/torchaudio come from the PyTorch
# CUDA 12.4 wheel index, and flash-attn must build without isolation so it
# can see the already-installed torch headers.

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
# Pull xformers from the same CUDA 12.4 index as torch to keep CUDA ABI consistent.
xformers = { index = "pytorch-cu124" }
# csrc/fused_dense_lib and csrc/layer_norm live as subdirectories inside the
# flash-attention repo. Pin to the same tag as flash-attn==2.7.0.post2.
fused-dense-lib = { git = "https://github.com/Dao-AILab/flash-attention.git", tag = "v2.7.0.post2", subdirectory = "csrc/fused_dense_lib" }
dropout-layer-norm = { git = "https://github.com/Dao-AILab/flash-attention.git", tag = "v2.7.0.post2", subdirectory = "csrc/layer_norm" }

[tool.uv]
# These CUDA-extension builds all need to see the installed torch headers,
# so the build must reuse the project env (no isolated PEP 517 build env).
no-build-isolation-package = ["flash-attn", "fused-dense-lib", "dropout-layer-norm"]
# Resolver overrides: pin transitive deps to the versions the original
# script-based install produced, in case a dependency tries to upgrade them.
override-dependencies = [
    "torch==2.5.0",
    "torchvision==0.20.0",
    "torchaudio==2.5.0",
    "flash-attn==2.7.0.post2",
    # hpsv2 caps protobuf<4; we keep the project's protobuf==5.28.3.
    "protobuf==5.28.3",
]

# Provide flash-attn's metadata statically so uv does NOT need to build it
# during resolution. Without this, uv tries to invoke the build backend before
# the project env exists, which fails because setuptools/torch aren't there yet.
# At install time, flash-attn will still be built — but by then the project env
# has setuptools, torch, packaging, ninja installed and the build can succeed.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.7.0.post2"
requires-dist = ["torch", "einops"]

# Same trick for the flash-attention CUDA subpackages — their setup.py imports
# torch at build time, so uv must NOT invoke the build backend during
# resolution. These static stubs let uv resolve, and the real build runs at
# install time when torch is already in the env.
[[tool.uv.dependency-metadata]]
name = "fused-dense-lib"
version = "0.0.0"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "dropout-layer-norm"
version = "0.1"
requires-dist = ["torch"]
